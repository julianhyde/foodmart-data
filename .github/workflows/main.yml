name: CI

on:
  push:
    branches:
      - '*'
  pull_request:
  workflow_dispatch: # allow manual triggering
  schedule:
    # Run at 01:45 UTC on the 7th day of each month
    #         m  h dom mon dow
    - cron: '45  1   7   *   *'

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ "1.22", "1.23", "stable" ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "These files are not gofmt-clean:"
            gofmt -l .
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  # Runs once, on the latest Go; the linters do not vary by version.
  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      # v9 installs golangci-lint 2.x, which .golangci.yml requires.
      - uses: golangci/golangci-lint-action@v9

  rust:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The lowest version is the "rust-version" in Cargo.toml.
        rust-version: [ "1.71", "stable" ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        run: |
          rustup toolchain install ${{ matrix.rust-version }} --profile minimal \
            --component rustfmt,clippy
          rustup default ${{ matrix.rust-version }}
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  # Checks that schema.go and src/schema.rs are up to date with the
  # schema in tools/schema.py, and that every CSV header matches
  # its declared columns.
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: Regenerate
        run: ./tools/schema.py
      - name: Check for differences
        run: |
          if ! git diff --exit-code; then
            echo "Generated files are stale; run ./tools/schema.py"
            exit 1
          fi

# End main.yml
